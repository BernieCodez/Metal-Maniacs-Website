<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Event — Competition Host</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/tools/competition/competition.css">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

<header class="comp-header">
  <a href="/tools" class="comp-header-logo">METAL <span>MANIACS</span></a>
  <div class="comp-header-title"><i class="fas fa-plus"></i> NEW EVENT</div>
  <div class="comp-header-right">
    <a href="/tools/competition/dashboard" class="cbtn cbtn-ghost cbtn-sm"><i class="fas fa-arrow-left"></i> Dashboard</a>
  </div>
</header>

<div class="auth-page-wrap" style="padding-top:2rem;">
  <div class="auth-card" style="max-width:580px;">
    <h1 class="auth-card-title" style="margin-bottom:1.5rem;">CREATE EVENT</h1>

    <div class="form-field">
      <label class="form-label">Competition Name <span class="req">*</span></label>
      <input type="text" class="cinput" id="ev-name" placeholder="e.g. Spring Qualifier 2026">
    </div>

    <div class="form-field">
      <label class="form-label">Hosting Team Name <span class="req">*</span></label>
      <input type="text" class="cinput" id="ev-team" placeholder="e.g. Metal Maniacs FTC">
    </div>

    <div class="form-row">
      <div class="form-field">
        <label class="form-label">Event Date</label>
        <input type="text" class="cinput" id="ev-date" placeholder="e.g. March 15, 2026">
      </div>
      <div class="form-field">
        <label class="form-label">Location</label>
        <input type="text" class="cinput" id="ev-location" placeholder="e.g. Lincoln High School">
      </div>
    </div>

    <div class="form-field">
      <label class="form-label">Description</label>
      <textarea class="cinput" id="ev-desc" rows="3" placeholder="Brief event description (optional)..." style="resize:vertical;"></textarea>
    </div>

    <div class="auth-err" id="create-err"></div>

    <div style="display:flex;gap:.75rem;margin-top:.5rem;">
      <button class="cbtn cbtn-red" style="flex:1;justify-content:center;padding:.75rem;" id="create-btn" onclick="submitNewEvent()">
        <i class="fas fa-trophy"></i> Create Event
      </button>
      <a href="/tools/competition/dashboard" class="cbtn cbtn-ghost" style="padding:.75rem 1.25rem;">Cancel</a>
    </div>
  </div>
</div>

<script src="/tools/competition/auth.js"></script>
<script>
  window.addEventListener('DOMContentLoaded', () => {
    if (!requireAuth()) return;
    document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.tagName !== 'TEXTAREA') submitNewEvent(); });
  });

  async function submitNewEvent() {
    const name        = document.getElementById('ev-name').value.trim();
    const hosting_team= document.getElementById('ev-team').value.trim();
    const event_date  = document.getElementById('ev-date').value.trim();
    const location    = document.getElementById('ev-location').value.trim();
    const description = document.getElementById('ev-desc').value.trim();
    const errEl       = document.getElementById('create-err');

    errEl.textContent = '';
    errEl.classList.remove('show');

    if (!name || !hosting_team) {
      errEl.textContent = 'Competition name and hosting team are required.';
      errEl.classList.add('show');
      return;
    }

    const btn = document.getElementById('create-btn');
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating…';

    const res  = await apiFetch('/api/events', {
      method: 'POST',
      body: JSON.stringify({ name, hosting_team, event_date, location, description }),
    });
    const data = await res.json();

    if (!res.ok) {
      errEl.textContent = data.error || 'Failed to create event.';
      errEl.classList.add('show');
      btn.disabled = false;
      btn.innerHTML = '<i class="fas fa-trophy"></i> Create Event';
      return;
    }

    window.location.replace('/tools/competition/event/' + data.id);
  }
</script>
</body>
</html>
