<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Metal Maniacs Tools</title>
    <link rel="stylesheet" href="/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <header>
        <nav>
            <a href="/" class="logo-link">
                <div class="logo">
                    METAL <span style="color:red;">MANIACS</span>
                </div>
            </a>
            <ul>
                <li><a href="/sponsors">Sponsors</a></li>
                <li><a href="/about">About</a></li>
                <li><a href="/team">Team</a></li>
                <li><a href="/robot">The Robot</a></li>
                <li><a href="/outreach">Outreach</a></li>
                <li><a href="/get-involved">Get Involved</a></li>
                <li><a href="/tools">Tools</a></li>
            </ul>
        </nav>
    </header>

    <section class="auth-section">
        <div class="auth-card">
            <div class="auth-logo">
                <i class="fas fa-gear"></i>
            </div>
            <h2>SIGN UP</h2>
            <p class="auth-subtitle">Create a Metal Maniacs Tools Account</p>

            <form class="auth-form" action="#" method="POST">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" placeholder="Your name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="you@example.com" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required>
                </div>
                <div class="form-group">
                    <label for="confirm-password">Confirm Password</label>
                    <input type="password" id="confirm-password" name="confirm-password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn primary auth-submit-btn">
                    <i class="fas fa-user-plus"></i> Create Account
                </button>
            </form>

            <p class="auth-switch">
                Already have an account? <a href="/tools/signin">Sign In</a>
            </p>
        </div>
    </section>

</body>
</html>
